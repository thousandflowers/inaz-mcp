[project]
name = "inaz-mcp"
version = "0.1.0"
description = "Server MCP per interrogare export Inaz (cedolini PDF, presenze/timbrature CSV)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0", "pypdf>=4.0.0"]
keywords = ["mcp", "inaz", "cedolini", "presenze", "payroll", "hr", "claude"]

[project.urls]
Homepage = "https://github.com/thousandflowers/inaz-mcp"
Repository = "https://github.com/thousandflowers/inaz-mcp"
Issues = "https://github.com/thousandflowers/inaz-mcp/issues"

[project.scripts]
inaz-mcp = "inaz_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inaz_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.coverage.report]
fail_under = 90
