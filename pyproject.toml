[project]
name = "inaz-mcp"
version = "0.1.0"
description = "Server MCP per interrogare export Inaz (cedolini PDF, presenze/timbrature CSV)"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0", "pypdf>=4.0.0"]

[project.scripts]
inaz-mcp = "inaz_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inaz_mcp"]
